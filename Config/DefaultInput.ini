; --- Contexts, in the order they are applied -----------------------
+MappingContext=IMC_OneBraham_Default    ; Keyboard and mouse. The lead platform.
+MappingContext=IMC_OneBraham_Gamepad    ; Controller, with pad dead zones and turn rates.
+MappingContext=IMC_OneBraham_Voice    ; Voice, radio and ping, so voice can be rebound without touching combat.
+MappingContext=IMC_OneBraham_UI    ; Menus, scoreboard, map. Applied above gameplay contexts.

