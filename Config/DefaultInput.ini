; ==========================================================================
;  ONE BRAHAM - DefaultInput.ini
;  Enhanced Input is the only input path (UE5.5). All bindings live in Data
;  Assets under /Game/OneBraham/Input (IA_* / IMC_*) are generated by
;  Tools/Python/onebraham/build_input.py; the default bindings below are
;  generated by Tools/Python/onebraham/generate_input_ini.py. This file
;  configures the classes,
;  deadzones, mouse handling and the debug console keys.
; ==========================================================================

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableGestureRecognizer=False
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=None
ConsoleKeys=Tilde
ConsoleKeys=Section
bUseLegacyInputScaling=True
bAlwaysShowTouchInterface=False

; --- Gamepad tuning: ONE BRAHAM is KBM-first but shipping full pad support.
;     Inner deadzone 0.18 keeps tired-controller drift out of aim; the
;     aim-assist curves live in IMC_Gamepad / UOneBrahamAimAssistSettings.
+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.180000,Sensitivity=1.000000,Exponent=1.100000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftY",AxisProperties=(DeadZone=0.180000,Sensitivity=1.000000,Exponent=1.100000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightX",AxisProperties=(DeadZone=0.160000,Sensitivity=1.000000,Exponent=1.700000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightY",AxisProperties=(DeadZone=0.160000,Sensitivity=1.000000,Exponent=1.700000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_LeftTriggerAxis",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Gamepad_RightTriggerAxis",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.000000,Sensitivity=0.070000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseWheelAxis",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))

; --- Legacy mappings kept intentionally minimal: the Two-Gun (debug) mapping
;     exists because Epic's internal test harness expects it, and the
;     spectator camera mappings are used by the death-cam when Enhanced Input
;     is temporarily unavailable during seamless travel.
+ActionMappings=(ActionName="DebugToggleCamera",Key=Eight,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="DebugEscape",Key=Escape,bShift=False,bCtrl=False,bAlt=False,bCmd=False)
+ActionMappings=(ActionName="SpectatorNextPlayer",Key=LeftMouseButton,bShift=False,bCtrl=False,bAlt=False,bCmd=False)

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bSendTriggeredEventsWhenInputIsFlushed=True
bEnableUserSettings=True
bEnableDefaultMappingContexts=True
bShouldOnlyTriggerLastActionInChord=True
bLogOnDeprecatedConfigUsed=True

[/Script/EnhancedInput.EnhancedInputPlatformSettings]
DefaultMappingContexts=()
DefaultWorldSubsystemMappingContexts=()

