; ==========================================================================
;  ONE BRAHAM - DefaultScalability.ini
;  5 tiers. Tier 0 targets a 2016 laptop iGPU at 720p30, Tier 4 targets a
;  high-end desktop at 1440p+ with hardware Lumen and VSM 16k shadows.
;  The menus map: Low=0, Medium=1, High=2, Epic=3, Ultra=4. A fresh install's
;  tier comes from UOneBrahamGameUserSettings::ChooseHardwarePreset (run once
;  by ApplyHardwareDefaultPreset from the game instance): Epic for an 8 GB
;  RTX-class card, Ultra at >= 10 GB, Medium for a base or Pro Apple M-series
;  chip and High for a Max / Ultra. On top: TSR dynamic resolution (50-100%,
;  60 fps budget), or on Apple Silicon - where dynamic resolution measured
;  slower - a fixed internal resolution of 50 / 71 / 87 / 100% by tier (50%
;  on a base M chip whatever the tier). The engine's benchmark only ever lowers
;  that pick;
;  its PerfIndexThresholds below are not used, because the tower costs about
;  four times the scene they were tuned for.
;
;  Post-process toggles in the settings menu (bloom, DoF, lens flares, fringe,
;  motion blur) switch an effect off; on, its quality is this file's value for
;  the current PostProcessQuality tier. r.Tonemapper.Quality is the tier's alone.
;
;  Only ECVF_Scalability variables belong here; the engine ignores anything
;  else with an ensure. r.ReflectionMethod and r.ReflectionCaptureResolution
;  live in DefaultEngine.ini. Per-tier r.Nanite.MaxPixelsPerEdge and
;  r.Lumen.Reflections.MaxRoughnessToTrace are not scalability variables in
;  UE 5.8 - if that tuning is wanted back, it goes in device profiles.
;
;  The engine reads the top level from sections named @Cine, not @4
;  (Scalability.cpp names the max level "Cine"), so Ultra's sections are
;  [Group@Cine]. Anything Ultra does not set falls through to the engine's own
;  BaseScalability @Cine values.
;
;  Render budgets (VSM page pool, Lumen surface cache) are sized for the
;  tower as it actually is: every floor loaded at once, ~40 shadow-casting
;  ceiling panels per floor, and a Lumen scene that holds cards for the floors
;  above and below. Epic has to fit a 16 GB Apple Silicon Mac (unified memory:
;  Metal's working-set limit is ~10.5 GB, shared with the CPU side) and an
;  8 GB mid-range Windows card (the preset logic gives an 8 GB RTX card Epic).
;  A VSM physical page is 128x128 R32 in two array slices (static + dynamic
;  cache) = 128 KB, plus ~16 KB of HZB; the surface cache costs ~15 bytes a
;  texel (BC-compressed material layers + R11G11B10 lighting atlases).
; ==========================================================================

[ScalabilitySettings]

; ---------------------------------------------------------------- Low (0) --
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.6
grass.DensityScale=0.4
foliage.LODDistanceScale=0.4
r.Streaming.PoolSize=1200

[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.5
r.LightCulling.ShallowMaximumLightCount=4

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.DirectLighting=0
r.AmbientOcclusionLevels=0
r.DistanceFieldAO=0
r.AmbientOcclusionRadiusScale=2.0

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0
r.SSR.HalfResSceneColor=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionMipLevelFactor=2.0
r.BloomQuality=1
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.EyeAdaptationQuality=1
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Quality=0
r.VolumetricFog=0
r.FastBlurThreshold=2

[TextureQuality@0]
r.Streaming.MipBias=1.0
r.MaxAnisotropy=2
r.Streaming.AmortizeCPUToGPUCopy=0
r.Streaming.MaxNumTexturesToStreamPerFrame=2
r.VT.MaxAnisotropy=2

[EffectsQuality@0]
r.TranslucencyLightingVolume.Dim=24
r.RefractionQuality=0
r.SSR=0
r.VolumetricFog=0
r.VolumetricCloud=0
r.Niagara.MaxStatInstancesPerEmitter=0
r.Niagara.Scalability.Pooling=0
r.LightShaftQuality=0
fx.Niagara.QualityLevel=0
r.Nanite=0

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[ShadingQuality@0]
r.Shaders.Quality=0

; ------------------------------------------------------------- Medium (1) --
[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=0.8
grass.DensityScale=0.6
foliage.LODDistanceScale=0.6
r.Streaming.PoolSize=1800

[ShadowQuality@1]
r.ShadowQuality=3
r.Shadow.Virtual.Enable=0
; The Enable=0 above (and the preset code's game-setting 0) loses to
; DefaultEngine.ini's RendererSettings r.Shadow.Virtual.Enable=1, which has
; project-setting priority - so Medium renders VSM today. Budget it so it does
; not fall back to the engine's Medium 512-page pool, which the tower's ~40
; shadowed panels a floor overflow. Smoke-tested: 1536 pages at the engine's
; +1 local bias still overflowed (the dynamic bias climbed to +1.8), so +2
; (a sixteenth of High's pages per panel - soft panel shadows hide it) and
; 2048 pages = 256 MB (+32 MB HZB). Harmless while VSM is off.
r.Shadow.Virtual.ResolutionLodBiasLocal=2.0
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=16
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.04
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.7

[GlobalIlluminationQuality@1]
; Low turns these off and no other tier named them, so a Low -> higher switch
; in the menu kept them off for the rest of the session (and a measurement
; taken that way flattered every tier). Stated in every tier above Low.
r.LumenScene.DirectLighting=1
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionRadiusScale=1.0
; Offscreen shadowing of the surface cache's ~700 lights was 10.7 ms of
; LumenSceneLighting's 16.7 ms on the M5 at Epic. Medium traces the global SDF
; for it instead of every mesh SDF: softer bounce occlusion off-screen, which
; only shows as indirect light leaking a little round corners.
r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs=0
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=4
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.RadianceCache.NumProbesToTraceBudget=100
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.TraceMeshSDFs=0
r.Lumen.DiffuseIndirect.Denoiser=1
r.Lumen.TranslucencyVolume.Enable=1
; Surface cache: the engine's Medium (2048 atlas at density 50) is ~3x
; oversubscribed by the tower. 3072^2 = ~140 MB at a density that keeps the
; near floor's cards and lets the far ones drop to their minimum.
r.LumenScene.SurfaceCache.AtlasSize=3072
r.LumenScene.SurfaceCache.CardTexelDensityScale=30
r.LumenScene.SurfaceCache.CardMaxResolution=256
; Half the default material-refresh budget: the office's materials do not
; change, so re-capturing them is pure cost on a Medium machine.
r.LumenScene.SurfaceCache.CardCaptureRefreshFraction=0.0625

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRayIntensity=4.0
r.SSR.Quality=2

[PostProcessQuality@1]
r.MotionBlurQuality=3
r.AmbientOcclusionMipLevelFactor=1.0
r.BloomQuality=4
r.DepthOfFieldQuality=1
r.LensFlareQuality=1
r.SceneColorFringeQuality=1
r.EyeAdaptationQuality=2
r.Tonemapper.GrainQuantization=1
r.Tonemapper.Quality=3
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[TextureQuality@1]
r.Streaming.MipBias=0.0
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4
r.Streaming.MaxNumTexturesToStreamPerFrame=4

[EffectsQuality@1]
r.VolumetricCloud=1
r.TranslucencyLightingVolume.Dim=32
r.RefractionQuality=1
r.SSR=1
r.LightShaftQuality=0
fx.Niagara.QualityLevel=1
r.Nanite=1

[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6

[ShadingQuality@1]
r.Shaders.Quality=1

; --------------------------------------------------------------- High (2) --
[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
grass.DensityScale=0.8
foliage.LODDistanceScale=0.8
r.Streaming.PoolSize=2600

[ShadowQuality@2]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
; Local lights at native resolution: a ceiling panel's shadow is soft anyway,
; and each shadowed panel is a six-face cube map, so a negative bias here
; multiplies the page count of every panel in view by 4x per step.
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
; 3072 pages = 384 MB (+48 MB HZB). The engine High default (2048) overflowed
; in the open-plan floors.
r.Shadow.Virtual.MaxPhysicalPages=3072
; 64 bpp transient mask (16 lights/pixel, ~16 MB at 1080p) - the engine default,
; stated so the tiers read side by side.
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=16
; The blockout boxes are non-Nanite and span many pages; marking them into the
; coarse (far, low-res) pages overflowed the marking job queue and costs more
; than it shows indoors. Coarse pages still get the Nanite geometry.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048
r.Shadow.RadiusThreshold=0.03
r.Shadow.CSM.MaxCascades=3
r.Shadow.DistanceScale=1.0

[GlobalIlluminationQuality@2]
; Restores what Low turns off (see Medium).
r.LumenScene.DirectLighting=1
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionRadiusScale=1.0
r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.RadianceCache.NumProbesToTraceBudget=300
r.Lumen.TraceMeshSDFs=1
r.Lumen.DiffuseIndirect.Denoiser=1
; 4096^2 = ~250 MB. Density 50 (engine High: 3584 at 100, which the tower
; oversubscribes ~4x) - resolution falls off with distance, so this mostly
; trims the floors above and below, not the room the player is in.
r.LumenScene.SurfaceCache.AtlasSize=4096
r.LumenScene.SurfaceCache.CardTexelDensityScale=50
r.LumenScene.SurfaceCache.CardCaptureRefreshFraction=0.0625

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRayIntensity=8.0
r.SSR.Quality=3

[PostProcessQuality@2]
r.Tonemapper.GrainQuantization=1
r.MotionBlurQuality=4
r.AmbientOcclusionMipLevelFactor=0.5
r.BloomQuality=5
r.DepthOfFieldQuality=2
r.LensFlareQuality=2
r.SceneColorFringeQuality=1
r.EyeAdaptationQuality=3
r.Tonemapper.Quality=5
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=96

[TextureQuality@2]
r.Streaming.MipBias=0.0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
r.Streaming.MaxNumTexturesToStreamPerFrame=6

[EffectsQuality@2]
r.VolumetricCloud=1
r.TranslucencyLightingVolume.Dim=48
r.RefractionQuality=2
r.SSR=2
r.LightShaftQuality=1
fx.Niagara.QualityLevel=2
r.Nanite=1

[FoliageQuality@2]
foliage.DensityScale=0.8
grass.DensityScale=0.8

[ShadingQuality@2]
r.Shaders.Quality=2

; --------------------------------------------------------------- Epic (3) --
[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=-1
r.ViewDistanceScale=1.0
grass.DensityScale=1.0
foliage.LODDistanceScale=1.0
r.Streaming.PoolSize=4000

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
; Was -1.0: with every floor's panels in range that asked for ~8,500 pages and
; overflowed a 4096-page pool (missing shadows). Native resolution for local
; lights; the sun keeps its sharper bias.
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
; 4096 pages = 512 MB (+64 MB HZB): the engine's Epic pool, kept rather than
; grown - fits the 16 GB Mac and an 8 GB card next to a 3-4 GB texture pool.
r.Shadow.Virtual.MaxPhysicalPages=4096
; 128 bpp transient mask, the engine's ceiling (32 lights/pixel): ~33 MB at
; 1080p, ~59 MB at 1440p, only alive during the lighting pass.
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
r.Shadow.MaxResolution=4096
r.Shadow.MaxCSMResolution=4096
r.Shadow.RadiusThreshold=0.02
r.Shadow.CSM.MaxCascades=4
r.Shadow.DistanceScale=1.0
r.Shadow.Virtual.SMRT.RayCountLocal=8
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2

[GlobalIlluminationQuality@3]
; Restores what Low turns off (see Medium).
r.LumenScene.DirectLighting=1
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionRadiusScale=1.0
r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.RadianceCache.NumProbesToTraceBudget=600
r.Lumen.TraceMeshSDFs=1
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.DiffuseIndirect.Denoiser=1
r.Lumen.TranslucencyVolume.Enable=1
; The engine's Epic (4096 at density 100) was oversubscribed by ~200% on a
; furnished floor. 6144^2 = ~565 MB (+315 MB over the engine's), at density 70
; (~half the texels of 100): the largest atlas that still leaves the 16 GB Mac
; and an 8 GB card room for textures; 8192 (~1 GB) is Ultra's.
r.LumenScene.SurfaceCache.AtlasSize=6144
r.LumenScene.SurfaceCache.CardTexelDensityScale=70

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRayIntensity=16.0
r.SSR.Quality=4

[PostProcessQuality@3]
r.Tonemapper.GrainQuantization=1
r.MotionBlurQuality=4
r.AmbientOcclusionMipLevelFactor=0.5
r.BloomQuality=5
r.DepthOfFieldQuality=3
r.LensFlareQuality=3
r.SceneColorFringeQuality=1
r.EyeAdaptationQuality=3
r.Tonemapper.Quality=5
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.VolumetricFog.HistoryMissSupersampleCount=4

[TextureQuality@3]
r.Streaming.MipBias=0.0
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16
r.Streaming.MaxNumTexturesToStreamPerFrame=8

[EffectsQuality@3]
r.VolumetricCloud=1
r.TranslucencyLightingVolume.Dim=64
r.RefractionQuality=3
r.SSR=4
r.LightShaftQuality=1
fx.Niagara.QualityLevel=3
r.Nanite=1
r.Niagara.MaxStatInstancesPerEmitter=512

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ShadingQuality@3]
r.Shaders.Quality=3

; -------------------------------------------------------------- Ultra (4) --
; Ultra = Epic + hardware ray tracing where supported. Kept as an explicit
; tier so the menu can offer "Ultra (RT)" on RTX-class hardware (>= 10 GB).
; Sections are @Cine: that is the name the engine reads for its top level.
[ViewDistanceQuality@Cine]
r.SkeletalMeshLODBias=-1
r.ViewDistanceScale=1.0
r.Streaming.PoolSize=5000

[ShadowQuality@Cine]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
; Engine Cine is 8192 pages (1 GB) and -1.5 directional; Ultra keeps Epic's
; biases and doubles Epic's pool (6144 = 768 MB) - an RTX card with >= 10 GB.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=0.0
r.Shadow.Virtual.MaxPhysicalPages=6144
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
r.Shadow.MaxResolution=8192
r.Shadow.MaxCSMResolution=8192
r.Shadow.Virtual.SMRT.RayCountLocal=12
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4

[GlobalIlluminationQuality@Cine]
; Restores what Low turns off (see Medium).
r.LumenScene.DirectLighting=1
r.AmbientOcclusionLevels=-1
r.AmbientOcclusionRadiusScale=1.0
r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.HitLighting.Allowed=1
r.Lumen.TraceMeshSDFs=1
; 8192^2 (the engine maximum: 64 pages of 128) = ~1 GB at full density.
r.LumenScene.SurfaceCache.AtlasSize=8192
r.LumenScene.SurfaceCache.CardTexelDensityScale=100

[ReflectionQuality@Cine]
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.Reflections.Allow=1

[PostProcessQuality@Cine]
r.Tonemapper.GrainQuantization=1
r.MotionBlurQuality=4
r.BloomQuality=5
r.DepthOfFieldQuality=4
r.LensFlareQuality=3
r.Tonemapper.Quality=5
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=192

[TextureQuality@Cine]
r.Streaming.MipBias=-0.5
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

[EffectsQuality@Cine]
r.VolumetricCloud=1
r.TranslucencyLightingVolume.Dim=64
r.RefractionQuality=3
r.SSR=4
r.LightShaftQuality=1
fx.Niagara.QualityLevel=4
r.Nanite=1

[FoliageQuality@Cine]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ShadingQuality@Cine]
r.Shaders.Quality=3
