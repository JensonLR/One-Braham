r.Streaming.PoolSize=5000

[ShadowQuality@4]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=8192
r.Shadow.MaxCSMResolution=8192
r.Shadow.Virtual.SMRT.RayCountLocal=12
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4

[GlobalIlluminationQuality@4]
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.TraceMeshSDFs=1

[ReflectionQuality@4]
r.ReflectionMethod=1
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.Reflections.Allow=1

[PostProcessQuality@4]
