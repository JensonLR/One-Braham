r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=-0.5
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048
r.Shadow.RadiusThreshold=0.03
r.Shadow.CSM.MaxCascades=3
r.Shadow.DistanceScale=1.0

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.RadianceCache.NumProbesToTraceBudget=300
r.Lumen.TraceMeshSDFs=1
r.Lumen.DiffuseIndirect.Denoiser=1

[ReflectionQuality@2]
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.Reflections.MaxRayIntensity=8.0
r.SSR.Quality=3

[PostProcessQuality@2]
r.MotionBlurQuality=4
r.AmbientOcclusionMipLevelFactor=0.5
r.BloomQuality=5
r.DepthOfFieldQuality=2
r.LensFlareQuality=2
r.SceneColorFringeQuality=1
r.EyeAdaptationQuality=3
r.Tonemapper.Quality=5
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=96

[TextureQuality@2]
r.Streaming.MipBias=0.0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
r.Streaming.MaxNumTexturesToStreamPerFrame=6

[EffectsQuality@2]
r.TranslucencyLightingVolume.Dim=48
r.RefractionQuality=2
r.SSR=2
r.LightShaftQuality=1
fx.Niagara.QualityLevel=2
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=1.0

[FoliageQuality@2]
foliage.DensityScale=0.8
grass.DensityScale=0.8

[ShadingQuality@2]
r.Shaders.Quality=2

; --------------------------------------------------------------- Epic (3) --
[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=-1
