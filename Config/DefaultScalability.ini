; ==========================================================================
;  ONE BRAHAM - DefaultScalability.ini
;  5 tiers. Tier 0 targets a 2016 laptop iGPU at 720p30, Tier 4 targets a
;  high-end desktop at 1440p+ with hardware Lumen and VSM 16k shadows.
;  The menus map: Low=0, Medium=1, High=2, Epic=3, Ultra=4 (shipping default
;  is Epic on first run when an RTX-class GPU is detected by
;  UOneBrahamGameUserSettings::ApplyHardwareDefaultPreset).
; ==========================================================================

[ScalabilitySettings]

; ---------------------------------------------------------------- Low (0) --
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.6
grass.DensityScale=0.4
foliage.LODDistanceScale=0.4
r.Streaming.PoolSize=1200

[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.5
r.LightCulling.ShallowMaximumLightCount=4

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.DirectLighting=0
r.AmbientOcclusionLevels=0
r.DistanceFieldAO=0
r.AmbientOcclusionRadiusScale=2.0

[ReflectionQuality@0]
r.ReflectionMethod=1
r.ReflectionCaptureResolution=64
r.Lumen.Reflections.Allow=0
r.SSR.Quality=0
r.SSR.HalfResSceneColor=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionMipLevelFactor=2.0
r.BloomQuality=1
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.EyeAdaptationQuality=1
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Quality=0
r.VolumetricFog=0
r.FastBlurThreshold=2

[TextureQuality@0]
r.Streaming.MipBias=1.0
r.MaxAnisotropy=2
r.Streaming.AmortizeCPUToGPUCopy=0
r.Streaming.MaxNumTexturesToStreamPerFrame=2
r.VT.MaxAnisotropy=2

[EffectsQuality@0]
r.TranslucencyLightingVolume.Dim=24
r.RefractionQuality=0
r.SSR=0
r.VolumetricFog=0
r.VolumetricCloud=0
r.Niagara.MaxStatInstancesPerEmitter=0
r.Niagara.Scalability.Pooling=0
r.LightShaftQuality=0
fx.Niagara.QualityLevel=0
r.Nanite=0

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[ShadingQuality@0]
r.Shaders.Quality=0

; ------------------------------------------------------------- Medium (1) --
[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=0.8
grass.DensityScale=0.6
foliage.LODDistanceScale=0.6
r.Streaming.PoolSize=1800

[ShadowQuality@1]
r.ShadowQuality=3
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.04
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.7

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=4
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.RadianceCache.NumProbesToTraceBudget=100
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.TraceMeshSDFs=0
r.Lumen.DiffuseIndirect.Denoiser=1
r.Lumen.TranslucencyVolume.Enable=1

[ReflectionQuality@1]
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.2
r.Lumen.Reflections.MaxRayIntensity=4.0
r.SSR.Quality=2

[PostProcessQuality@1]
r.MotionBlurQuality=3
r.AmbientOcclusionMipLevelFactor=1.0
r.BloomQuality=4
r.DepthOfFieldQuality=1
r.LensFlareQuality=1
r.SceneColorFringeQuality=1
r.EyeAdaptationQuality=2
r.Tonemapper.GrainQuantization=1
r.Tonemapper.Quality=3
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64

[TextureQuality@1]
r.Streaming.MipBias=0.0
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4
r.Streaming.MaxNumTexturesToStreamPerFrame=4

[EffectsQuality@1]
r.TranslucencyLightingVolume.Dim=32
r.RefractionQuality=1
r.SSR=1
r.LightShaftQuality=0
fx.Niagara.QualityLevel=1
r.Nanite=1
r.Nanite.MaxPixelsPerEdge=4.0

[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6

[ShadingQuality@1]
r.Shaders.Quality=1

; --------------------------------------------------------------- High (2) --
[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
grass.DensityScale=0.8
foliage.LODDistanceScale=0.8
r.Streaming.PoolSize=2600

[ShadowQuality@2]
