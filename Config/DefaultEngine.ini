+Profiles=(Name="OneBrahamHitbox",CollisionEnabled=QueryOnly,ObjectTypeName="Hitbox",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="Hitbox",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Ignore)),HelpMessage="Per-bone damage volumes. Query only, never simulates. Ignores the Interactable channel: a standing colleague must not hide the door behind them, which is what a Block response here did.")
+Profiles=(Name="OneBrahamWeapon",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Pawn",Response=ECR_Overlap),(Channel="Camera",Response=ECR_Ignore),(Channel="Weapon",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Overlap)),HelpMessage="Weapon actors. Query-only: weapons never push the world.")
+Profiles=(Name="OneBrahamGlass",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Glass",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Glass",Response=ECR_Ignore),(Channel="Hitbox",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Block)),HelpMessage="Breakable glass: blocks movement + camera, shattered by the Weapon channel.")
+Profiles=(Name="OneBrahamInteractable",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Pawn",Response=ECR_Block),(Channel="Interactable",Response=ECR_Block),(Channel="Glass",Response=ECR_Block),(Channel="Visibility",Response=ECR_Block)),HelpMessage="Doors, terminals, lifts, shutters, pickups.")
+Profiles=(Name="OneBrahamPenetrable",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Penetrable",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Pawn",Response=ECR_Block),(Channel="Visibility",Response=ECR_Block),(Channel="Hitbox",Response=ECR_Ignore)),HelpMessage="Shoot-through cubicle walls and plasterboard. Weapons always trace through; damage is reduced by the material penetration multiplier.")
+Profiles=(Name="OneBrahamVolume",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Weapon",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore)),HelpMessage="Access/extraction/lockdown trigger volumes. Never blocks anything.")
+Profiles=(Name="OneBrahamRagdoll",CollisionEnabled=QueryAndPhysics,ObjectTypeName="PhysicsBody",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Hitbox",Response=ECR_Ignore),(Channel="Interactable",Response=ECR_Ignore)),HelpMessage="Dead-player ragdolls: bullets still register for style stats; ragdolls never block living players and never block an interaction trace either - a corpse in a doorway is scenery, not a door.")
+Profiles=(Name="OneBrahamVoiceOccluder",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Weapon",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Hitbox",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore)),HelpMessage="Muffles proximity voice: walls, fire shutters, glass partitions.")
