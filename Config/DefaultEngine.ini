; --------------------------------------------------------------------------
;  Online / Steam. AppId 480 is Spacewar: swap for the shipping AppId in
;  Config/Windows/WindowsEngine.ini and the Linux server config.
;
;  Steam is the shipping subsystem; a dev machine without the Steam client
;  must still host and join. Three things make that work, none of which
;  changes a shipped build:
;    * DefaultPlatformService=Steam falls back to the NULL subsystem by itself
;      when Steam cannot initialise (FOnlineSubsystemModule::LoadDefaultSubsystem):
;      sessions are then LAN-only and direct IP works. -nosteam skips the Steam
;      attempt altogether (OnlineSubsystemSteam's module checks it at startup).
;    * bRelaunchInSteam is off here. It only exists outside Shipping (a
;      Shipping build always calls RestartAppIfNecessary with the shipping AppId,
;      see GetRelaunchSettings in OnlineSubsystemSteam.cpp); on a dev Mac it
;      fired a steam:// URL nobody could open, and with the Steam client
;      installed (not running) SteamAPI_RestartAppIfNecessary asks the game to
;      quit so Steam can relaunch it - a "?listen" launch that dies before it
;      opens a net driver. Config/Windows/WindowsEngine.ini already had it off.
;    * The game net driver is defined as Steam-with-IP-fallback. The engine
;      loads DriverClassName only when the class exists and IsAvailable() (the
;      Steam IP socket subsystem registered, i.e. Steam initialised); anything
;      else - no SocketSubsystemSteamIP plugin, no Steam client, -nosteam, a
;      Mac build - gets the plain IpNetDriver that "?listen" and
;      "open 127.0.0.1" need. Beacon and demo drivers keep the engine defaults.
; --------------------------------------------------------------------------

[/Script/Engine.GameEngine]
-NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemSteamIP.SteamNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

; The Steam net driver moved from OnlineSubsystemSteam into the
; SocketSubsystemSteamIP plugin; the old section name configured nothing.
