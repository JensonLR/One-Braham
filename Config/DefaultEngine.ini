; --------------------------------------------------------------------------
;  Collision. ONE BRAHAM ships custom trace channels for weapon fire,
;  interaction, glass, access zones and extraction volumes so that
;  Blueprint/C++ traces never need to guess a channel index.
;
;  Channel map (kept in sync with OneBrahamTypes.h EOneBrahamTraceChannel):
;   GameTraceChannel1  = Weapon       (bullet traces + melee)
;   GameTraceChannel2  = Glass        (breakable glass only)
;   GameTraceChannel3  = Interactable (doors, terminals, lifts, pickups)
;   GameTraceChannel4  = Penetrable   (shoot-through cubicle walls, drywall)
;   GameTraceChannel5  = AccessZone   (keycard volume checks, never blocks)
;   GameTraceChannel6  = Hitbox       (character hit registration volumes)
;   GameTraceChannel7  = VoiceOccluder(this mesh muffles proximity voice)
;   GameTraceChannel8  = Extraction   (extraction / lockdown trigger volumes)
;   GameTraceChannel9  = HelicopterBlocker
;   GameTraceChannel10 = ProjectileBlocker (grenades bounce off)
; --------------------------------------------------------------------------

[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Glass")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Interactable")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Penetrable")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel5,DefaultResponse=ECR_Overlap,bTraceType=True,bStaticObject=False,Name="AccessZone")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel6,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Hitbox")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel7,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=True,Name="VoiceOccluder")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel8,DefaultResponse=ECR_Overlap,bTraceType=True,bStaticObject=False,Name="Extraction")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel9,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="HelicopterBlocker")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel10,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="ProjectileBlocker")

; --- Player capsule: blocks world + other players, hit by bullets --------
; Profiles' ObjectTypeName must be an object channel. Weapon, Interactable,
; AccessZone and VoiceOccluder are trace channels (bTraceType=True, traced by
; channel in code), so the profiles that named them as their object type
; never resolved; they use engine object types and keep their responses.
