; Baked by the content build, then patched at runtime. Doors unlocking, fire
; shutters sealing, walls breached and glass broken all change *collision* and
; call AddDirtyArea; Static ignores that (and puts "NAVMESH NEEDS TO BE REBUILT"
; on screen the first time it happens), DynamicModifiersOnly only re-applies
; modifier volumes over cached geometry, so a breached wall would stay solid for
; the AI. Dynamic rebuilds just the dirtied 10 m tiles, on worker threads, a few
; times a match. Lifts never dirty it (their parts don't affect navigation).
