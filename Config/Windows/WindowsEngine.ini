; ==========================================================================
;  ONE BRAHAM - Windows client engine overrides
;  Shipping Steam AppId, crash reporter, and Windows-specific renderer tweaks.
;  Replace SteamDevAppId with the real AppId before release (see Docs/19).
; ==========================================================================

[OnlineSubsystemSteam]
SteamDevAppId=480
bUseSteamNetworking=true
bRelaunchInSteam=false

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
AudioSampleRate=48000
AudioCallbackBufferFrameSize=512
AudioNumBuffersToEnqueue=1
AudioMaxChannels=64

[/Script/Engine.RendererSettings]
r.SkinCache.Mode=1
r.GPUCrashDebugging=0

[/Script/Engine.GameEngine]
+CrashReportClientConfigName=OneBraham
bUseFixedFrameRate=False
FixedFrameRate=60.000000

; --------------------------------------------------------------------------
;  Log verbosity on a player's machine. The developer defaults in
;  Config/DefaultEngine.ini log a lot on purpose; this is what a shipped
;  client runs with, so a 40-minute match does not write 30 MB of framework
;  chatter into the player's Saved/Logs.
;
;  LogOneBrahamNet stays at Log while the game is in early access: net
;  problems are the support ticket a player can actually describe ("it says
;  I was behind cover"). Turn it to Warning when the netcode is boring.
; --------------------------------------------------------------------------
[Core.Log]
LogOneBraham=Warning
LogOneBrahamMatch=Log
LogOneBrahamNet=Log
LogOneBrahamAccess=Warning
LogOneBrahamExtraction=Log
LogOneBrahamWeapons=Warning
LogOneBrahamAudio=Warning
LogOneBrahamUI=Warning
LogOneBrahamBots=Warning
LogOneBrahamVoice=Warning
LogOneBrahamAudit=Log

; These three are the framework's loudest and least useful on a client.
LogStreaming=Error
LogWorldPartition=Warning
LogNiagara=Error
