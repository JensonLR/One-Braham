; ==========================================================================
;  ONE BRAHAM - DefaultGameUserSettings.ini
;  First-run defaults for UOneBrahamGameUserSettings. Deliberately shipped as
;  a *clean* file: everything here is regenerated from the defaults in
;  Source/OneBraham/Core/OneBrahamGameUserSettings.cpp. Per-user values are
;  written to Saved/Config/<platform>/GameUserSettings.ini under the user's
;  data directory:
;    Mac      ~/Library/Containers/<bundle id>/Data/Library/Application Support/Epic/OneBraham/Saved/Config/Mac/
;             (the sandbox container; unsandboxed builds use
;             ~/Library/Application Support/Epic/OneBraham/Saved/Config/Mac/)
;    Windows  %LOCALAPPDATA%/OneBraham/Saved/Config/Windows/
;    Editor   <project>/Saved/Config/MacEditor/ (or WindowsEditor/) for -game runs
;
;  The graphics preset is deliberately NOT set here. On a fresh install (no
;  per-user file yet) UOneBrahamGameInstance::Init runs
;  UOneBrahamGameUserSettings::ApplyHardwareDefaultPreset, which picks the tier
;  from the GPU family / VRAM / benchmark, picks dynamic resolution or a fixed
;  internal resolution, and saves bHardwarePresetApplied=True so it never runs again. A preset written
;  here would be every machine's tier until then, and a base Apple M-series
;  chip at Epic draws ~73 ms a frame in the tower.
; ==========================================================================

[/Script/Engine.GameUserSettings]
bUseVSync=False
; TSR + dynamic resolution (60 fps budget, 50-100%) - see ApplyDynamicResolutionCVars.
; First run turns it off again on Apple Silicon, where it measured slower than
; a fixed internal resolution (PrefersDynamicResolution).
bUseDynamicResolution=True
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
WindowPosX=-1
WindowPosY=-1
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1
Version=5
AudioQualityLevel=0
FrameRateLimit=0.000000
DesiredScreenWidth=1280
bUseDesiredScreenHeight=False
DesiredScreenHeight=720
LastCPUBenchmarkResult=-1.0
LastGPUBenchmarkResult=-1.0
LastGPUBenchmarkMultiplier=1.0
LastMemoryStat=-1.0
bUseHDRDisplayOutput=False
HDRDisplayOutputNits=1000.000000
LastGPUBenchmarkStep=-1

