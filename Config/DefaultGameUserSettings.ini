; ==========================================================================
;  ONE BRAHAM - DefaultGameUserSettings.ini
;  First-run defaults for UOneBrahamGameUserSettings. Deliberately shipped as
;  a *clean* file: everything here is regenerated from the defaults in
;  Source/OneBraham/Core/OneBrahamGameUserSettings.cpp, and per-user values
;  are written to %LOCALAPPDATA%/OneBraham/Saved/Config/Windows/GameUserSettings.ini
; ==========================================================================

[/Script/Engine.GameUserSettings]
bUseVSync=False
bUseDynamicResolution=False
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
WindowPosX=-1
WindowPosY=-1
FullscreenMode=1
LastConfirmedFullscreenMode=1
PreferredFullscreenMode=1
Version=5
AudioQualityLevel=0
FrameRateLimit=0.000000
DesiredScreenWidth=1280
bUseDesiredScreenHeight=False
DesiredScreenHeight=720
LastCPUBenchmarkResult=-1.0
LastGPUBenchmarkResult=-1.0
LastGPUBenchmarkMultiplier=1.0
LastMemoryStat=-1.0
bUseHDRDisplayOutput=False
HDRDisplayOutputNits=1000.000000
LastGPUBenchmarkStep=-1

[/Script/OneBraham.OneBrahamGameUserSettings]
; --- Display ---------------------------------------------------------------
DisplayGamma=2.200000
ColourBlindMode=Off
bShowFPS=False
bShowNetStats=False
FPSLimitMenu=120
FPSLimitGameplay=0
bBorderlessOnAltEnter=True

; --- Graphics --------------------------------------------------------------
; Enums are written by name: the engine reads an enum property by its value's
; name. Per-group scalability (shadows, textures, ...) is the engine's own
; [ScalabilityGroups] section, which GraphicsQualityPreset drives; it is not a
; property of this class, and lines for it here were ignored.
GraphicsQualityPreset=Epic
ResolutionScale=100.000000
AntiAliasingMethod=4
UpscalerMode=TSR
bMotionBlur=False
MotionBlurAmount=0.250000
bFilmGrain=True
FilmGrainIntensity=0.020000
bChromaticAberration=True
ChromaticAberrationIntensity=0.050000
bBloom=True
BloomIntensity=1.000000
bDepthOfField=True
DepthOfFieldMenusOnly=True
bLensFlare=True
bRayTracedReflections=False
bHardwareLumen=False
LumenQuality=1
bNanite=True
bVirtualShadowMaps=True
bRayTracingShadows=False
bRayTracingAmbientOcclusion=False

; --- Audio -----------------------------------------------------------------
MasterVolume=1.000000
MusicVolume=0.650000
SFXVolume=1.000000
WeaponVolume=1.000000
FootstepVolume=1.000000
DialogueVolume=1.000000
AnnouncementVolume=0.800000
UIVolume=0.800000
VoiceChatVolume=1.000000
VoiceInputGain=1.000000
VoiceOutputGain=1.000000
VoiceChatMode=PushToTalk
bVoiceChatEnabled=True
bVoiceActivationEnabled=False
VoiceActivationThreshold=0.009000
bVoiceNoiseSuppression=True
bVoiceMuffledThroughWalls=True
VoiceSubmixPreset=Raw
AudioOutputDeviceId=""
bSubtitlesEnabled=True
SubtitleScale=1.000000
bAnnouncementsEnabled=True
bDirectionalHitIndicators=True

; --- Gameplay / Accessibility ---------------------------------------------
bHoldToSprint=False
bToggleCrouch=True
bToggleLean=False
bToggleADS=True
bAutoReloadOnEmpty=True
bSprintRequiresForwardInput=True
bInvertMouseY=False
bInvertGamepadY=False
MouseSensitivityX=0.070000
MouseSensitivityY=0.070000
MouseSensitivityADSMultiplier=0.650000
GamepadSensitivityX=0.070000
GamepadSensitivityY=0.070000
AimAssistStrength=0.600000
bAimAssistEnabled=True
FOV=90.000000
ADSFieldOfViewTransitionSpeed=1.000000
ControllerVibration=1.000000
bViewBobbing=True
ViewBobbingAmount=1.000000
bCameraShake=True
CameraShakeIntensity=1.000000
bShowDamageNumbers=False
HUDScale=1.000000
bColorBlindFriendlyMarkers=False
EnemyOutlineMode=0
bShowKillFeed=True
bShowVoiceIndicators=True
bShowProximityVoiceDebug=False
bAutoSkipIntro=False
bReduceMotion=False
bScreenShakeReduction=False

; --- Controls ---------------------------------------------------------------
; Keys are not settings of this class. Defaults ship in DefaultInput.ini's
; [OneBraham.Input] section; a player's rebinds are written to the same section
; of their GameUserSettings.ini, and the controller rebuilds its bindings context
; from both. The per-key lines that used to sit here named properties that do not
; exist (and gave E to both interact and lean), so the engine ignored every one.
bUsePushToTalk=True
bVoiceChannelCycleEnabled=True

; --- Privacy / telemetry ---------------------------------------------------
bShareAnonymousStats=True
bAllowRichPresence=True
bAllowSteamOverlay=True
PreferredRegion="EU-West"
LastUsedServerAddress=""
LastUsedServerPort=7777
bAllowCrossplay=True
