; ==========================================================================
;  ONE BRAHAM - DefaultDeviceProfiles.ini
;  Texture pool budgets + quality floors per GPU memory bucket. These are
;  used by UOneBrahamGameUserSettings::ApplyHardwareDefaultPreset to pick the
;  first-run preset, and by the streaming system on dedicated servers / Linux.
; ==========================================================================

[/Script/Engine.DeviceProfileManager]
bSupportsDeviceProfiles=True
bRestrictWidthToViewportSize=False
TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_Weapon,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_WeaponNormalMap,MinLODSize=1,MaxLODSize=4096,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_Effects,MinLODSize=1,MaxLODSize=2048,LODBias=0)
TextureLODGroups=(Group=TEXTUREGROUP_UI,MinLODSize=1,MaxLODSize=2048,LODBias=0)

[Windows DeviceProfile]
+CVars=r.Streaming.PoolSize=3000

[Windows_Low DeviceProfile]
+CVars=r.Streaming.PoolSize=1200
+CVars=MaxTextureSize=1024

[Windows_Medium DeviceProfile]
+CVars=r.Streaming.PoolSize=1800
+CVars=MaxTextureSize=2048

[Windows_High DeviceProfile]
+CVars=r.Streaming.PoolSize=2600
+CVars=MaxTextureSize=4096

[Windows_Epic DeviceProfile]
+CVars=r.Streaming.PoolSize=4000
+CVars=MaxTextureSize=8192

; Dedicated server: no renderer, so strip every streaming/rendering cvar and
; use the tiny texture pool that a headless Linux host actually needs.
[LinuxServer DeviceProfile]
+CVars=r.Streaming.PoolSize=64
+CVars=r.Streaming.UseFixedPoolSize=1
+CVars=r.ShadowQuality=0
+CVars=r.VolumetricFog=0
+CVars=r.Nanite=0
+CVars=r.SkinCache.CompileShaders=0
+CVars=net.MaxNetTickRate=60
DeviceType=LinuxServer

[WindowsServer DeviceProfile]
+CVars=r.Streaming.PoolSize=64
+CVars=r.Streaming.UseFixedPoolSize=1
+CVars=r.ShadowQuality=0
+CVars=r.VolumetricFog=0
+CVars=r.Nanite=0
+CVars=net.MaxNetTickRate=60
DeviceType=WindowsServer
