; ==========================================================================
;  ONE BRAHAM - DefaultGame.ini
;  Project branding, packaging/map cook list, session defaults, mode defaults,
;  GameplayTags declared for designers and automation tests.
; ==========================================================================

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=1A7B4E3C4F9B4E1E9C6F0B1E2D3A4C5B
ProjectName=ON BREAK
CompanyName=One Braham Interactive
Description=On Break: a pure PvP vertical extraction shooter inside One Braham, a London office tower at Aldgate. 12 players, 3 squads of 4, ground floor to the 15th-floor Skydeck.
Homepage=https://onebraham.game
SupportContact=support@onebraham.game
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "ON BREAK")
ProjectDebugTitleInfo=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDebugTitleInfo", "ONE BRAHAM (Unstable Build)")
CopyrightNotice=Copyright (c) 2026 One Braham Interactive. All Rights Reserved.
bUseBorderlessWindow=False
bStartInVR=False

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
BuildTarget=OneBraham
FullRebuild=False
ForDistribution=True
IncludeDebugFiles=False
BlueprintNativizationMethod=Disabled
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bCompressed=True
bSkipEditorContent=True
bShareMaterialShaderCode=True
; Off: on Mac, packing the SM6 global shader metallib passes the metal tool
; more than 256 arguments and UE 5.8 crashes in CreateProc (cook exit 25).
; Shaders ship in Unreal's own shader archive instead.
bSharedMaterialNativeLibraries=False
bDeterministicShaderCodeOrder=True
bGenerateChunks=True
bChunkHardReferencesOnly=False
bBuildHttpChunkInstallData=False
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/Data")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/Input")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/UI")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/VFX")
+DirectoriesToAlwaysCook=(Path="/Game/OneBraham/Characters/Shared")
+DirectoriesToNeverCook=(Path="/Game/OneBraham/Dev")
+DirectoriesToNeverCook=(Path="/Game/OneBraham/Tests")
+DirectoriesToNeverCook=(Path="/Game/OneBraham/SourceArt")
+MapsToCook=(FilePath="/Game/OneBraham/Maps/L_Persistent_OneBraham")
MapsToCook=(FilePath="/Game/OneBraham/Maps/L_Loading")
MapsToCook=(FilePath="/Game/OneBraham/Maps/L_FireDrill_Arena")
MapsToCook=(FilePath="/Game/OneBraham/Maps/L_Tutorial_SignIn")
+MapsToCook=(FilePath="/Game/OneBraham/Maps/L_Benchmark_Skydeck")

[/Script/Engine.GameSession]
MaxPlayers=16
MaxSpectators=4
MaxPartySize=4

[/Script/Engine.GameModeBase]
GameSessionClass=/Script/Engine.GameSession
bUseSeamlessTravel=True
bPauseable=False

; --------------------------------------------------------------------------
;  ONE BRAHAM match defaults. Overridable per-mode by UOneBrahamMatchSettingsAsset.
;  These are compiled defaults used when a Data Asset is not assigned so the
;  game is always playable (e.g. right after a code-only sync).
; --------------------------------------------------------------------------
[/Script/OneBraham.OneBrahamMatchSettings]
DefaultMode=Ascent
AscentSquadCount=3
AscentSquadSize=4
AscentSpectatorsAllowed=True
AscentExtractionHoldSeconds=30.0
AscentHelicopterArrivalSeconds=45.0
AscentLockdownStageSeconds=90.0
AscentAccessUnlockCostSeconds=12.0
AscentStartingKeycardTier=Public
AscentSpawnGraceSeconds=8.0
AscentRespawnEnabled=False
AscentFriendlyFire=False
AscentDownedStateEnabled=True
AscentBleedOutSeconds=60.0
AscentReviveSeconds=4.5
FireDrillTeamSize=6
FireDrillScoreToWin=200
FireDrillRespawnDelaySeconds=5.0
FireDrillControlPointSeconds=4.0
FireDrillEnabledControlPoints=Lobby,ServerFloor,Skydeck
NightShiftPlayerCount=4
NightShiftEnemyWaves=8
bAllowJoinInProgress=False
bAllowSpectators=True
bEnableProximityVoice=True
bEnableTeamVoice=True
bProximityVoiceMaxDistance=3500.0
bProximityVoiceOcclusion=True
WarmupSeconds=30.0
PostMatchSeconds=45.0
bRecordMatchSummary=True

[/Script/OneBraham.OneBrahamGameSettings]
; The two mapping contexts the controller installs (build_input.py authors
; their keys). Soft paths: nothing loads until a local player needs input.
DefaultMappingContext=/Game/OneBraham/Input/IMC_OneBraham_Default.IMC_OneBraham_Default
CommonMappingContext=/Game/OneBraham/Input/IMC_OneBraham_UI.IMC_OneBraham_UI
; Server-side audit + anti-cheat thresholds (see Docs/18).
MaxFireRateTolerance=0.08
MaxMovementSpeedTolerance=1.35
MaxInteractDistanceTolerance=220.0
RpcBudgetPerSecond=90
bLogSuspiciousActions=True
bKickOnRepeatedViolations=False
ViolationsBeforeKick=25

