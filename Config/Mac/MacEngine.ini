; ==========================================================================
;  ONE BRAHAM - Mac platform overrides for Engine.ini
; ==========================================================================

; The player profile (settings, binds, accessibility) is saved under the
; local player's net id (UOneBrahamGameInstance::LoadProfile/SaveProfile).
; There is no Steam on Mac, so that id comes from the Null subsystem, which
; only uses its stable "<host>-<login id>" form when the process can take the
; first-instance lock file in /tmp. The packaged app is sandboxed and cannot
; open /tmp, so every launch got a fresh random id: a new, empty profile each
; time (settings never came back) and one more orphaned .sav in the container.
; Two copies on one Mac now share an id, which nothing in the game keys on.
[OnlineSubsystemNull]
bForceStableNullId=true
