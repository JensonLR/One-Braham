; ==========================================================================
;  ONE BRAHAM - Linux dedicated server engine overrides
;  Headless: no renderer, no audio device, tick-rate locked to 60 Hz so the
;  server tick and the lag-compensation history line up with clients.
; ==========================================================================

[OnlineSubsystemSteam]
SteamDevAppId=480
GameServerQueryPort=27015
bUseSteamNetworking=true
bVACEnabled=1

[/Script/Engine.RendererSettings]
r.SkinCache.CompileShaders=0
r.SupportSkyAtmosphereAffectsHeightFog=0
r.VolumetricFog=0
r.Lumen.HardwareRayTracing=0
r.Nanite=0
r.Shadow.Virtual.Enable=0
r.CustomDepth=0

[/Script/Engine.AudioSettings]
bAllowPlayWhenSilent=False
DefaultSoundClassName=
VoiPSampleRate=Normal_16000Hz

[/Script/Engine.NetDriver]
NetServerMaxTickRate=60
MaxNetTickRate=60
NetEnablePauseChannels=True

; Dedicated servers accept remote console for the ops team, never for players.
[ConsoleVariables]
net.AllowEncryption=1

[/Script/Engine.GameEngine]
bSmoothFrameRate=True
MinSmoothedFrameRate=30
MaxSmoothedFrameRate=120

; --------------------------------------------------------------------------
;  Log verbosity on a headless host. A dedicated server is where the useful
;  evidence lives: who unlocked the Skydeck, who breached which partition,
;  which shot was rejected by the anti-cheat. It is also a host that runs many
;  servers per machine, so the chatty categories are cheaper here.
; --------------------------------------------------------------------------
[Core.Log]
LogOneBraham=Log
LogOneBrahamMatch=Log
LogOneBrahamNet=Log
LogOneBrahamAccess=Log
LogOneBrahamExtraction=Log
LogOneBrahamWeapons=Warning
LogOneBrahamAudio=Error
LogOneBrahamUI=Error
LogOneBrahamBots=Warning
LogOneBrahamVoice=Warning
LogOneBrahamAudit=All

; A server has no interest in anything the renderer has to say.
LogRenderTargetPool=Error
LogD3D12RHI=Error
LogVulkanRHI=Error
LogNiagara=Error
