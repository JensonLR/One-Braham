; ==========================================================================
;  ONE BRAHAM - DefaultEditor.ini
;  Editor defaults for level design, asset creation and the map builder.
; ==========================================================================

[/Script/UnrealEd.EditorLoadingSavingSettings]
bDeleteSourceFilesWithAssets=False
bAutomaticallyCheckoutOnAssetModification=True
bPromptForCheckoutOnAssetModification=False
bAutoReimportTextures=True
bAutoReimportAudio=True
bAutoReimportSourceData=True
bMonitorContentDirectories=True
bRestoreOpenAssetTabsOnRestart=True
bForceCompilationAtStartup=False
SaveMeshMaterialsWithStaticMeshes=True
AutosaveTimeMinutes=10.000000
bAutoSaveEnable=True

[/Script/UnrealEd.EditorProjectAppearanceSettings]
bShowShaderCompileStats=True
bDisplayUnitsOnAllWidgets=False

[/Script/UnrealEd.LevelEditorPlaySettings]
PlayNetMode=PIE_Standalone
PlayNumberOfClients=3
PlayNetDedicated=False
bLaunchSeparateServer=False
RunUnderOneProcess=True
bUseSingleProcessForPlayInEditor=True
PlayNetAllowJoinInProgress=True
PlayInEditorViewportSize=(X=1920,Y=1080)
LastExecutedPlayModeType=PlayMode_InEditorFloating
bShowMouseControlOptions=True

[/Script/UnrealEd.LevelEditorViewportSettings]
bEnableDropToFloorViewport=True
bUseSelectionOutline=True
bHighlightWithBrackets=True
UsePercentageBasedScaling=False
SnapDistance=10.0

[/Script/UnrealEd.EditorExperimentalSettings]
bEnableActorFolders=True
bEnableAsyncTextureCompilation=True
; No World Partition: the tower is one persistent level with an always-loaded
; sublevel per floor (Docs/09 section 6). A 2D streaming grid over sixteen
; storeys stacked on one footprint loads all of them or none of them.

[/Script/UnrealEd.EditorPerProjectUserSettings]
bDisplayUIExtensionPoints=False
bEnableLocalizationDashboard=True
bUseLessBlueprints=True

[/Script/UnrealEd.CookerSettings]
DefaultCookMode=CookMode_OnTheFly

[/Script/BlueprintGraph.BlueprintEditorSettings]
bSpawnDefaultBlueprintNodes=True
bHideUnrelatedNodes=False
bShowGraphInstructionText=True
bEnableContextMenuFiltering=True
bEnableSCSCompilerFixup=True

[/Script/DataValidation.EditorValidator]
bValidateOnSave=True
bValidateMaterialsOnSave=True
bValidateBlueprintsOnSave=True
bDisplayDataValidationSummary=True

; Directories the ONE BRAHAM Python automation scripts write into.
; Tools/Python/*.py are executed headless via:
;   UnrealEditor-Cmd.exe OneBraham.uproject -run=pythonscript -script="<path>"
[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bDeveloperMode=True
bIsolateInterpreterEnvironment=False
+AdditionalImportPaths=(Path="Tools/Python")
+AdditionalImportPaths=(Path="Tools/Python/onebraham")

[/Script/UnrealEd.EditorEngine]
bEnableWorldBrowser=True
bEnableEditorFavorites=False

[/Script/UnrealEd.EditorStyleSettings]
ColorVisionDeficiencyMode=NoDeficiency

[/Script/Engine.AssetManagerSettings]
bUseLazyScanForAssetManager=True
